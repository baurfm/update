name: Lint

on:
  push:
    paths:
      - 'update.ps1'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'update.ps1'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

jobs:
  parse-check:
    name: Parse check (PS5.1 + PS7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("${{ github.workspace }}\update.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::$_" }
            throw "PowerShell 5.1 parse failed with $($errors.Count) error(s)."
          }
          Write-Host "PS5.1 parse OK"

      - name: Parse with PowerShell 7
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("${{ github.workspace }}\update.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::$_" }
            throw "PowerShell 7 parse failed with $($errors.Count) error(s)."
          }
          Write-Host "PS7 parse OK"

  analyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer (fail on Error severity only)
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $results = Invoke-ScriptAnalyzer -Path .\update.ps1 -Severity Error,Warning
          $results | Format-Table -AutoSize | Out-String | Write-Host
          $errorCount = ($results | Where-Object Severity -eq 'Error').Count
          if ($errorCount -gt 0) {
            throw "PSScriptAnalyzer found $errorCount error-severity issue(s)."
          }
